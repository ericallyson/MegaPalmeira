# Produção (Coolify): `docker compose -f docker-compose.prod.yml up -d --build`
# Variáveis vêm do ambiente do Coolify (ou de um .env de produção).
services:
  web:
    build:
      context: .
      dockerfile: docker/prod.Dockerfile
      target: web
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/prod.Dockerfile
      target: app
    environment:
      APP_ROLE: web
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: docker/prod.Dockerfile
      target: app
    command: ["php", "artisan", "queue:work", "database", "--queue=payments,apuracao,notifications,default", "--tries=3", "--sleep=2", "--max-time=3600"]
    environment:
      APP_ROLE: worker
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/prod.Dockerfile
      target: app
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_ROLE: worker
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  reverb:
    build:
      context: .
      dockerfile: docker/prod.Dockerfile
      target: app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment:
      APP_ROLE: worker
    env_file:
      - .env
    ports:
      - "${REVERB_PUBLIC_PORT:-8081}:8080"
    restart: unless-stopped

  ssr:
    build:
      context: .
      dockerfile: docker/prod.Dockerfile
      target: ssr
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-megapalmeira}
      MYSQL_USER: ${DB_USERNAME:-megapalmeira}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
