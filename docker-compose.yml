services:
  nginx:
    image: nginx:1.27-alpine
    container_name: megapalmeira_nginx
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    container_name: megapalmeira_app
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    container_name: megapalmeira_queue
    command: ["php", "artisan", "queue:work", "redis", "--queue=payments,apuracao,notifications,default", "--tries=3", "--sleep=2"]
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    container_name: megapalmeira_scheduler
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ssr:
    image: node:22-alpine
    container_name: megapalmeira_ssr
    working_dir: /var/www/html
    command: ["node", "bootstrap/ssr/ssr.js"]
    volumes:
      - .:/var/www/html
    restart: unless-stopped

  reverb:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    container_name: megapalmeira_reverb
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8081:8080"
    volumes:
      - .:/var/www/html
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: megapalmeira_mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: megapalmeira
      MYSQL_USER: megapalmeira
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: megapalmeira_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
  redis_data:
